# Ponte WebAssembly do Archilly para o symbios-tensor.
#
# Vive na área de TRABALHO (archilly/), depende do upstream por caminho e não o
# modifica.
#
# `getrandom` aparece aqui por causa de `rand 0.9`, que o motor usa. Em wasm32 ele
# exige escolha explícita de backend. O LAB-00 usou a feature `wasm_js`, que
# funciona — mas arrasta `wasm-bindgen` e, com ele, um import
# `__wbindgen_placeholder__` que o módulo passa a exigir do ambiente. Um módulo com
# import de glue não carrega com `WebAssembly.instantiate(bytes, {})`.
#
# Aqui o backend é `custom` (ver src/lib.rs): o módulo fica **sem import nenhum** e
# carrega em qualquer ambiente. Compilar com:
#
#   RUSTFLAGS='--cfg getrandom_backend="custom"' cargo build --release \
#     --target wasm32-unknown-unknown
[package]
name = "archilly-symbios-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
symbios-tensor = { path = "../../upstream" }
symbios-ground = "0.4"
glam = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
